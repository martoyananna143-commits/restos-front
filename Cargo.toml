[package]
name = "resty_form_alpha"
version = "0.1.0"
authors = ["AtariOverlord09 <anatgo99088@gmail.com>"]
edition = "2021"

[dependencies]
# Dioxus with web features (includes signals, macros, html)
dioxus = { version = "0.7", features = ["web", "router"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
sha2 = "0.10"
gloo-net = "0.6"      # Lightweight HTTP client for WASM
gloo-timers = "0.3"   # Timers for WASM
gloo-storage = "0.3"  # LocalStorage for WASM
urlencoding = "2.1"   # URL percent-encoding for form submissions
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
uuid = { version = "1.20.0", features = ["serde"] }
qrcodegen = "1.8"
web-sys = { version = "0.3", features = [
    "Window",
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "CryptoKeyPair",
    "RequestCredentials",
    "Request",
    "RequestInit",
    "Headers",
    "Response",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbRequest",
    "IdbVersionChangeEvent",
    "DomException",
    "Event",
    "EventTarget",
    "Navigator",
    "CredentialsContainer",
    "CredentialCreationOptions",
    "CredentialRequestOptions",
    "PublicKeyCredential",
    "AuthenticatorAttestationResponse",
    "AuthenticatorAssertionResponse",
    "Document",
    "Element",
    "DomRect",
    "HtmlElement",
    "Location",
    "History",
    "MediaQueryList",
    "CssStyleDeclaration",
    "UrlSearchParams",
    "console",
    "FormData",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "File",
    "FileList",
    "HtmlTextAreaElement",
    "HtmlInputElement",
] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.58"

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Single codegen unit for better optimization
panic = "abort"      # Smaller binary, no unwinding
strip = true         # Strip symbols
incremental = false
